<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>XOS</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; font-family: system-ui, sans-serif; }
    body { position: relative; isolation: isolate; }
    img, video { position: relative; z-index: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
    .center { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 32px; text-align: center; background: #09090b; }
    .logo { position: absolute; top: 0; left: 0; width: 220px; height: 220px; border-radius: 50%; overflow: hidden; background: #fff; box-shadow: 0 0 40px rgba(255,255,255,.18); will-change: transform; }
    .logo img { width: 100%; height: 100%; object-fit: contain; padding: 14%; box-sizing: border-box; background: #fff; }
    .center p { margin: 0; max-width: 640px; font-size: 20px; font-weight: 600; opacity: .85; }
    .video-controls { position: absolute; left: 24px; bottom: 24px; z-index: 2147483647; display: flex !important; visibility: visible !important; opacity: 1 !important; pointer-events: auto; gap: 8px; padding: 8px; border: 1px solid rgba(255,255,255,.16); border-radius: 16px; background: rgba(9,9,11,.9); box-shadow: 0 14px 34px rgba(0,0,0,.55); backdrop-filter: blur(12px); }
    .video-controls button { display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border: 0; border-radius: 11px; background: #2563eb; color: white; cursor: pointer; transition: background .16s ease, transform .16s ease; }
    .video-controls button:hover { background: #1d4ed8; transform: translateY(-1px); }
    .video-controls button:active { transform: scale(.94); }
    .video-controls button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .video-controls svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    @media (max-width: 600px) { .video-controls { left: 12px; bottom: 12px; } .video-controls button { width: 48px; height: 48px; } }
  </style>
</head>
<body>
  <script>
    const params = new URLSearchParams(location.search)
    const kind = params.get('kind')
    const src = params.get('src') || ''
    const name = params.get('name') || ''
    const root = document.body
    let longPressTimer = null
    let media = null
    let videoControls = null
    let playButton = null
    let muteButton = null

    function startLongPress() {
      if (!window.player?.reset) return
      longPressTimer = setTimeout(() => window.player.reset(), 1200)
    }

    function cancelLongPress() {
      if (longPressTimer) clearTimeout(longPressTimer)
      longPressTimer = null
    }

    document.addEventListener('pointerdown', startLongPress)
    document.addEventListener('pointerup', cancelLongPress)
    document.addEventListener('pointercancel', cancelLongPress)
    document.addEventListener('pointerleave', cancelLongPress)

    function el(tag, props) {
      return Object.assign(document.createElement(tag), props)
    }

    const icons = {
      play: '<svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z" fill="currentColor" stroke="none"/></svg>',
      pause: '<svg viewBox="0 0 24 24"><path d="M7 5v14M17 5v14"/></svg>',
      mute: '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5ZM16 9l5 5m0-5-5 5"/></svg>',
      unmute: '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 9.5a4 4 0 0 1 0 5m2.5-7.5a8 8 0 0 1 0 10"/></svg>',
    }

    function syncVideoControls() {
      if (!media || !playButton || !muteButton) return
      const playing = !media.paused
      const muted = media.muted || media.volume === 0
      playButton.innerHTML = playing ? icons.pause : icons.play
      playButton.setAttribute('aria-label', playing ? 'Pause video' : 'Play video')
      playButton.title = playing ? 'Pause video' : 'Play video'
      muteButton.innerHTML = muted ? icons.mute : icons.unmute
      muteButton.setAttribute('aria-label', muted ? 'Unmute video' : 'Mute video')
      muteButton.title = muted ? 'Unmute video' : 'Mute video'
    }

    function createVideoControls() {
      videoControls = el('div', { className: 'video-controls' })
      playButton = el('button', { type: 'button' })
      muteButton = el('button', { type: 'button' })
      playButton.addEventListener('click', () => media?.paused ? media.play().catch(() => {}) : media?.pause())
      muteButton.addEventListener('click', () => { if (media) media.muted = !media.muted })
      videoControls.append(playButton, muteButton)
      root.append(videoControls)
      media.addEventListener('play', syncVideoControls)
      media.addEventListener('pause', syncVideoControls)
      media.addEventListener('volumechange', syncVideoControls)
      syncVideoControls()
    }

    function handleControl(command) {
      const action = command?.action
      if (action === 'play' && media) media.play().catch(() => {})
      if (action === 'pause' && media) media.pause()
      if (action === 'mute' && media) media.muted = true
      if (action === 'unmute' && media) media.muted = false
    }

    window.player?.onControl?.(handleControl)

    // Screensaver: the TR logo in a circle drifts in a random direction and bounces off the
    // screen edges. Throttled to ~30fps and transform-only so it stays light on the CPU.
    function screensaver() {
      const logo = el('div', { className: 'logo' })
      logo.append(el('img', { src: 'icon.png', alt: 'TR' }))
      root.append(logo)

      const size = 220
      const speed = 140 // px per second
      let x = Math.random() * Math.max(1, innerWidth - size)
      let y = Math.random() * Math.max(1, innerHeight - size)
      let angle = Math.random() * Math.PI * 2
      let vx = Math.cos(angle) * speed
      let vy = Math.sin(angle) * speed
      let last = performance.now()

      // Nudge the heading a little after each bounce so the path never settles into a loop.
      function jitter() {
        const a = Math.atan2(vy, vx) + (Math.random() - 0.5) * 0.5
        vx = Math.cos(a) * speed
        vy = Math.sin(a) * speed
      }

      function frame(now) {
        requestAnimationFrame(frame)
        const dt = now - last
        if (dt < 33) return
        last = now
        const step = Math.min(dt, 100) / 1000
        x += vx * step
        y += vy * step
        const maxX = innerWidth - size
        const maxY = innerHeight - size
        if (x <= 0) { x = 0; vx = Math.abs(vx); jitter(); vx = Math.abs(vx) }
        else if (x >= maxX) { x = maxX; vx = -Math.abs(vx); jitter(); vx = -Math.abs(vx) }
        if (y <= 0) { y = 0; vy = Math.abs(vy); jitter(); vy = Math.abs(vy) }
        else if (y >= maxY) { y = maxY; vy = -Math.abs(vy); jitter(); vy = -Math.abs(vy) }
        logo.style.transform = `translate(${x}px, ${y}px)`
      }
      requestAnimationFrame(frame)
    }

    if (kind === 'saver') {
      screensaver()
    } else if (kind === 'image') {
      root.append(el('img', { src, alt: name }))
    } else if (kind === 'video') {
      media = el('video', { src, autoplay: true, loop: true })
      root.append(media)
      createVideoControls()
    } else if (kind === 'audio') {
      const box = el('div', { className: 'center' })
      media = el('audio', { src, autoplay: true, loop: true })
      box.append(el('p', { textContent: name }), media)
      root.append(box)
    } else if (kind === 'pdf' || kind === 'website') {
      root.append(el('iframe', { src, title: name }))
    } else {
      const box = el('div', { className: 'center' })
      box.append(el('p', { textContent: params.get('text') || '' }))
      root.append(box)
    }
  </script>
</body>
</html>
