<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>XOS</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #09090b; color: #f4f4f5; font-family: "Segoe UI", system-ui, sans-serif; }
    main { width: 100%; height: 100%; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, #27272a 0, #18181b 30%, #09090b 72%); }
    section { display: grid; justify-items: center; gap: 18px; text-align: center; }
    img { width: 112px; height: 112px; border-radius: 50%; padding: 14px; box-sizing: border-box; background: #fff; box-shadow: 0 0 44px rgba(255,255,255,.16); }
    h1 { margin: 0; font-size: 28px; letter-spacing: .04em; }
    p { margin: 0; color: #a1a1aa; font-size: 16px; }
    i { width: 28px; height: 28px; border: 3px solid #52525b; border-top-color: #fafafa; border-radius: 50%; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main><section><img src="icon.png" alt="TR Fastenings" /><h1>XOS</h1><p>Starting player…</p><i aria-label="Loading"></i></section></main>
</body>
</html>
